<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | iGo ReGo</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <script src="site.config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>
  <main class="section">
    <div class="container" style="max-width: 680px;">
      <div class="section__header">
        <span class="section__label">Create your account</span>
        <h1 class="section__title">Sign up for iGo ReGo</h1>
        <p class="section__subtitle">Register now and we will create your customer profile in Shopmonkey automatically.</p>
      </div>

      <form id="signup-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="signup-first-name">First name <span class="required">*</span></label>
          <input id="signup-first-name" name="firstName" type="text" required autocomplete="given-name">
        </div>

        <div class="form-group">
          <label for="signup-last-name">Last name <span class="required">*</span></label>
          <input id="signup-last-name" name="lastName" type="text" required autocomplete="family-name">
        </div>

        <div class="form-group">
          <label for="signup-email">Email address <span class="required">*</span></label>
          <input id="signup-email" name="email" type="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="signup-phone">Phone number <span class="required">*</span></label>
          <input id="signup-phone" name="phone" type="tel" required autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="signup-company">Company name</label>
          <input id="signup-company" name="companyName" type="text" autocomplete="organization">
        </div>

        <div class="form-group">
          <label for="signup-password">Password <span class="required">*</span></label>
          <input id="signup-password" name="password" type="password" required autocomplete="new-password">
        </div>

        <div class="form__error" role="alert" aria-live="assertive"></div>

        <button type="submit" class="btn btn--primary">Create Account</button>
      </form>

      <p style="margin-top: 1.5rem;">Already have an account? <a href="login.html">Log in here</a>.</p>
    </div>
  </main>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
